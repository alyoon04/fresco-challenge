databases:
  - name: fresco-db
    plan: free
    databaseName: fresco
    user: fresco

services:
  # --- Backend API ---
  - type: web
    name: fresco-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fresco-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fresco-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false # Render will prompt you to fill this in
      - key: UPLOAD_DIR
        value: /app/uploads
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    preDeployCommand: "pip install alembic psycopg2-binary sqlalchemy && alembic upgrade head"

  # --- Celery Worker ---
  - type: worker
    name: fresco-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    dockerCommand: "celery -A celery_worker worker --loglevel=info --concurrency=2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fresco-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fresco-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
    disk:
      name: worker-uploads
      mountPath: /app/uploads
      sizeGB: 1

  # --- Redis ---
  - type: redis
    name: fresco-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # only internal access

  # --- Frontend ---
  - type: web
    name: fresco-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to fresco-backend's URL after first deploy
